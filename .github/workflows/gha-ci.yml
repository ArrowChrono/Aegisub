name: Aegisub CI

on:
  push:
    branches: [exp]
  pull_request:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-2025-vs2026
    env:
      PROJECT_VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      PROJECT_VCPKG_INSTALLED_ROOT: ${{ github.workspace }}\vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-release
      VCPKG_BINARY_SOURCES: 'clear;nuget,https://nuget.pkg.github.com/AmusementClub/index.json,readwrite'
      VCPKG_DISABLE_METRICS: '1'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        # Full history is required for build/version.* to count commits since the
        # SVN->Git migration anchor; shallow clones yield version number 0.
        fetch-depth: 0


    - name: read vcpkg baseline
      id: vcpkg-baseline
      shell: pwsh
      run: |
        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        "ref=$baseline" >> $env:GITHUB_OUTPUT

    - name: checkout vcpkg
      uses: actions/checkout@v6
      with:
        repository: microsoft/vcpkg
        ref: ${{ steps.vcpkg-baseline.outputs.ref }}
        path: vcpkg
        fetch-depth: 0

    - name: setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: prepare dependencies
      shell: pwsh
      run: |
        dotnet build/package-win-portable.cs -- --mode prepare-dependency --cache-dir .cache/package-win-portable

    - name: bootstrap vcpkg
      shell: pwsh
      run: |
        & "$env:PROJECT_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

    - name: show build environment
      shell: pwsh
      run: |
        Write-Host "=== GitHub runner ==="
        Write-Host "ImageOS=$env:ImageOS"
        Write-Host "ImageVersion=$env:ImageVersion"

        Write-Host "`n=== Visual Studio ==="
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -property installationPath
        & $vswhere -latest -products * -property catalog_productDisplayVersion
        Write-Host $vsPath

        Write-Host "`n=== MSVC toolsets ==="
        Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
          Select-Object -ExpandProperty Name

        Write-Host "`n=== CMake ==="
        cmake --version

        Write-Host "`n=== PowerShell ==="
        Write-Host $PSVersionTable.PSVersion

        Write-Host "`n=== vcpkg ==="
        & "$env:PROJECT_VCPKG_ROOT\vcpkg.exe" version

    - name: configure nuget credentials
      shell: pwsh
      run: |
        $nugetPath = & "$env:PROJECT_VCPKG_ROOT\vcpkg" fetch nuget
        & $nugetPath sources add -Source 'https://nuget.pkg.github.com/AmusementClub/index.json' -Name 'GitHub' -UserName 'AmusementClub' -Password $env:GITHUB_TOKEN -StorePasswordInClearText
        & $nugetPath setapikey $env:GITHUB_TOKEN -Source 'https://nuget.pkg.github.com/AmusementClub/index.json'

    - name: build
      id: build
      shell: pwsh
      run: |
        ./build/build-win-vcpkg.ps1 -Mode build -VcpkgRoot $env:PROJECT_VCPKG_ROOT -VcpkgInstalledRoot $env:PROJECT_VCPKG_INSTALLED_ROOT -VcpkgInstallOptions '--x-abi-tools-use-exact-versions'

    - name: test
      id: test
      if: success()
      continue-on-error: true
      shell: pwsh
      run: |
        ./build/build-win-vcpkg.ps1 -Mode test -VcpkgRoot $env:PROJECT_VCPKG_ROOT -VcpkgInstalledRoot $env:PROJECT_VCPKG_INSTALLED_ROOT

    - name: package portable
      id: package
      if: always() && steps.build.outcome == 'success'
      shell: pwsh
      run: |
        dotnet build/package-win-portable.cs -- --mode package --build-dir build-dir/Release --cache-dir .cache/package-win-portable

    - name: upload artifact
      if: always() && steps.package.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: aegisub-win-x64-portable.zip
        path: artifacts/win-portable/aegisub-portable.zip

    - name: fail on test error
      if: always() && steps.test.outcome == 'failure'
      shell: pwsh
      run: |
        throw 'Tests failed.'
